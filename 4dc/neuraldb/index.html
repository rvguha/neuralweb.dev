<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neural DB over Data Commons</title>
  <style>
    :root { color-scheme: light dark; --muted: #52607d; --bg: #fbfbfa; }
    @media (prefers-color-scheme: dark) { :root { --muted: #9aa1ab; --bg: #15181c; } }
    html, body { margin: 0; background: var(--bg); }
    .crumb { max-width: 920px; margin: 0 auto; padding: 14px 16px 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .crumb a { color: var(--muted); }
    iframe { display: block; width: 100%; height: 100vh; border: 0; background: var(--bg); }
  </style>
</head>
<body>
  <!-- The Neural DB page itself, unchanged and served from kg.neuralweb.dev; the only difference is the restriction in the address. -->
  <div class="crumb"><a href="../">&larr; Data Commons</a></div>
  <iframe id="neuraldb" title="Neural DB over Data Commons" src="https://kg.neuralweb.dev/?sources=datacommons"></iframe>
  <script>
    // The framed page reports how tall its content is, so this page scrolls instead of the frame.
    addEventListener('message', e => {
      if (e.origin !== 'https://kg.neuralweb.dev' || !e.data || e.data.type !== 'neuralkg-height') return;
      if (Number.isFinite(e.data.height)) document.getElementById('neuraldb').style.height = Math.ceil(e.data.height) + 'px';
    });
  </script>
</body>
</html>
