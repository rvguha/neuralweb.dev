<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARD over Data Commons</title>
  <style>
    :root { color-scheme: light dark; --ink: #1d2433; --muted: #52607d; --accent: #3b5ccc; --line: #dfe4ef; --card: #fff; --bg: #f6f7fb; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e7e9ec; --muted: #9aa1ab; --accent: #8fb0ff; --line: #2c3037; --card: #1c1f24; --bg: #14161a; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 860px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -.01em; }
    .lede { margin: 0 0 28px; color: var(--muted); max-width: 660px; }
    .crumb { font-size: .9rem; margin-bottom: 18px; } .crumb a { color: var(--muted); }
    a { color: var(--accent); }
    form { display: flex; gap: 8px; margin-bottom: 8px; }
    input[type=text] { flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    button { padding: 12px 18px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .examples { margin: 0 0 24px; font-size: .9rem; color: var(--muted); }
    .examples button { all: unset; cursor: pointer; color: var(--accent); margin-right: 12px; text-decoration: underline; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
    .card h2 { margin: 0 0 4px; font-size: 1.05rem; } .card p { margin: 4px 0; }
    .meta, .status { color: var(--muted); font-size: .88rem; }
    .tag { display: inline-block; margin: 2px 4px 0 0; padding: 1px 8px; border: 1px solid var(--line); border-radius: 99px; font-size: .78rem; color: var(--muted); }
    .claim { font-size: 1.05rem; }
    .err { color: #c0392b; }
  </style>
</head>
<body>
  <main>
    <div class="crumb"><a href="/4dc/">&larr; Data Commons</a></div>
    <h1>ARD search over Data Commons</h1>
    <p class="lede">Which Data Commons variables, from which sources, can answer a question? Results are ARD entries restricted to the <code>datacommons</code> source.</p>
    <form id="f"><input type="text" id="q" maxlength="400" placeholder="e.g. median household income by county" autofocus aria-label="Search"><button id="go">Search</button></form>
    <p class="examples">Try: <button type="button">unemployment rate by state</button><button type="button">life expectancy by country</button><button type="button">homicide rate</button><button type="button">CO2 emissions per capita</button></p>
    <div id="out" aria-live="polite"></div>
    <script>
    const API = 'https://ard.neuralweb.dev/search', REPO = 'https://github.com/rvguha/ard-finder/blob/main/';
    const out = document.getElementById('out'), q = document.getElementById('q'), go = document.getElementById('go');
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const money = x => x < 0.01 ? '$' + x.toFixed(5) : '$' + x.toFixed(3);
    const STAGES = { 'embed-query': 'Embed the question', rerank: 'Rerank candidates' };
    function report(u, seconds, n) {
      const box = el('details', 'report'); box.open = true;
      const head = el('summary', 'status', n + ' result' + (n === 1 ? '' : 's') + ' \u00b7 ' + seconds.toFixed(1) + ' s' +
        (u ? ' \u00b7 ' + u.total_tokens.toLocaleString() + ' tokens \u00b7 ' + money(u.cost_usd || 0) : ''));
      box.append(head);
      for (const ev of (u && u.call_events) || []) {
        const ok = ev.outcome === 'success';
        box.append(el('p', 'meta', (ok ? '\u2713 ' : '\u2717 ') + (STAGES[ev.stage] || ev.stage) + ' \u00b7 ' + ev.model + ' \u00b7 ' +
          (ev.elapsed_ms / 1000).toFixed(2) + ' s \u00b7 ' + ev.tokens.toLocaleString() + ' tokens \u00b7 ' + money(ev.cost_usd || 0) + (ok ? '' : ' \u00b7 ' + ev.outcome)));
      }
      return box;
    }
    async function search(text) {
      out.replaceChildren(el('p', 'status', 'Searching…')); go.disabled = true;
      const t0 = performance.now();
      try {
        const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: { text }, sources: ['datacommons'], limit: 10 }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        out.replaceChildren();
        out.append(report(d.usage, (performance.now() - t0) / 1000, d.results.length));
        if (!d.results.length) out.append(el('p', 'status', 'No Data Commons documents matched.'));
        for (const e of d.results) {
          const c = el('div', 'card'); c.append(el('h2', '', e.displayName), el('p', '', e.description));
          const tags = el('p'); for (const t of e.tags || []) tags.append(el('span', 'tag', t)); c.append(tags);
          if (e.representativeQueries && e.representativeQueries.length) c.append(el('p', 'meta', 'Answers questions like: ' + e.representativeQueries.slice(0, 2).join(' · ')));
          const m = el('p', 'meta'); m.append('Document: ');
          const a = el('a', '', e['okf:sourceDocument']); a.href = REPO + e['okf:sourceDocument']; m.append(a); c.append(m);
          out.append(c);
        }
      } catch (err) { out.replaceChildren(el('p', 'err', 'Search failed: ' + err.message)); }
      go.disabled = false;
    }
    document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); if (q.value.trim()) search(q.value.trim()); });
    document.querySelectorAll('.examples button').forEach(b => b.addEventListener('click', () => { q.value = b.textContent; search(q.value); }));
    </script>
  </main>
</body>
</html>
